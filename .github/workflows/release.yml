name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing the GitHub Release"
        required: true
        type: boolean
        default: true

      version:
        description: "Version for test archives (e.g. 0.0.0-test)"
        required: true
        type: string
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Validate schemas and data
        run: pnpm schema:check

      - name: Package release
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$MANUAL_VERSION"
          fi

          RELEASE_DIR="release"

          mkdir -p "$RELEASE_DIR"

          package() {
            local suffix="$1"
            shift

            local root="avix-data-v${VERSION}-${suffix}"
            local archive="${root}.zip"

            mkdir -p "$RELEASE_DIR/$root"

            cp manifest.yaml \
              data/config.json \
              data/data-contract.md \
              "$RELEASE_DIR/$root/"

            cp -r data/schema "$RELEASE_DIR/$root/"

            for locale in "$@"; do
              cp -r "data/$locale" "$RELEASE_DIR/$root/"
            done

            (
              cd "$RELEASE_DIR"
              zip -qr "$archive" "$root"
            )
          }

          package all en vi th zh

          for locale in en vi th zh; do
            package "$locale" "$locale"
          done

      - name: Inspect release archives
        run: |
          set -euo pipefail

          ls -lh release/*.zip

          for archive in release/*.zip; do
            echo "=== $archive ==="
            unzip -t "$archive"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            release/*.zip

      - name: Append manifest to release notes
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="$(mktemp)"

          gh release view "$TAG" \
            --json body \
            --jq '.body' > "$NOTES_FILE"

          {
            cat "$NOTES_FILE"
            printf '\n\n---\n\n'
            cat manifest.yaml
          } > "${NOTES_FILE}.final"

          gh release edit "$TAG" \
            --notes-file "${NOTES_FILE}.final"
